<header class="header" [class.scrolled]="isScrolled">
  <div class="header-container">

    <!-- Logo / Brand -->
    <div class="brand cursor-pointer" (click)="scrollTo('about')">
      <span class="brand-text">J.Rabuñal<span class="brand-dot">.</span></span>
    </div>

    <!-- Mobile Hamburger -->
    <button class="hamburger-btn"
      type="button"
      (click)="toggleMenu()"
      [class.active]="isMenuOpen"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-navigation"
      aria-label="Toggle Navigation">
      <span class="bar"></span>
      <span class="bar"></span>
      <span class="bar"></span>
    </button>

    <!-- Navigation Links -->
    <nav id="primary-navigation" class="nav-menu" [class.open]="isMenuOpen">
      <button class="nav-link" (click)="scrollTo('experience')">{{ langService.t().nav.experience }}</button>
      <button class="nav-link" (click)="scrollTo('projects')">{{ langService.t().nav.projects }}</button>
      <button class="nav-link" (click)="scrollTo('skills')">{{ langService.t().nav.skills }}</button>
      <button class="nav-link" (click)="scrollTo('education')">{{ langService.t().nav.education }}</button>
      <button class="nav-link nav-btn-primary" (click)="scrollTo('contact')">{{ langService.t().nav.contact }}</button>

      <!-- Language Toggle -->
      <button class="lang-toggle-btn" (click)="langService.toggleLanguage()" aria-label="Toggle Language">
        <span [class.active]="langService.currentLang === 'en'">EN</span>
        <span class="divider">/</span>
        <span [class.active]="langService.currentLang === 'es'">ES</span>
      </button>
    </nav>

  </div>
</header>
