<div class="container">
  <h2 class="section-title">{{ langService.t().experience.section_title }}</h2>

  <div class="timeline">

    <div *ngFor="let job of workHistory()" class="timeline-item">
      <div class="timeline-dot"></div>

      <div class="timeline-content">
        <div class="experience-header">
          <div class="company-logo" *ngIf="job.logo">
            <img [src]="job.logo" [alt]="job.companyName + ' Logo'">
          </div>

          <div class="experience-title">
            <h3>{{ job.companyName }}</h3>
            <p class="experience-role">{{ job.role }}</p>
            <p class="experience-period">
              <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" fill="currentColor" class="bi bi-calendar3"
                viewBox="0 0 16 16">
                <path
                  d="M14 0H2a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V2a2 2 0 0 0-2-2zM1 3.857C1 3.384 1.448 3 2 3h12c.552 0 1 .384 1 .857v10.286c0 .473-.448.857-1 .857H2c-.552 0-1-.384-1-.857V3.857z" />
                <path
                  d="M6.5 7a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm-9 3a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2zm3 0a1 1 0 1 0 0-2 1 1 0 0 0 0 2z" />
              </svg>
              {{ job.period }}
            </p>
          </div>
        </div>

        <ul class="experience-points">
          <li *ngFor="let achievement of job.achievements">{{ achievement }}</li>
        </ul>
      </div>
    </div>

  </div>
</div>
