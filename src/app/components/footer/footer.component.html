<footer class="footer">
    <div class="footer-container">
        <div class="footer-content">
            <!-- Brand & Message -->
            <div class="footer-brand">
                <h3>J.Rabuñal<span class="text-gradient">.</span></h3>
                <p class="footer-message text-muted">
                    {{ langService.t().footer.message }}
                </p>
            </div>

            <!-- Contact / Location -->
            <div class="footer-contact text-muted">
                <p>
                    <span class="footer-location-icon">
                        <app-icon name="location" [size]="16"></app-icon>
                    </span>
                    {{ langService.t().footer.location }}
                </p>
            </div>

            <!-- Social Links -->
            <div class="footer-social">
                <a href="https://www.linkedin.com/in/juanmarabunal/" target="_blank" rel="noopener noreferrer" aria-label="LinkedIn">
                    <app-icon name="linkedin" [size]="24" [ariaHidden]="true"></app-icon>
                </a>
                <a href="https://github.com/juanmarab" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
                    <app-icon name="github" [size]="24" [ariaHidden]="true"></app-icon>
                </a>
                <a href="mailto:juanmarabunal@gmail.com" aria-label="Email">
                    <app-icon name="email" [size]="24" [ariaHidden]="true"></app-icon>
                </a>
            </div>
        </div>
        <div class="footer-bottom text-muted">
            <p>{{ langService.t().footer.rights }}</p>
        </div>
    </div>
</footer>
