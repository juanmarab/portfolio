<div class="skills-section">
    <div class="skills-bg-glow"></div>
    <div class="container skills-container">
        <!-- Filter Tabs -->
        <div class="filter-tabs">
            <button class="filter-btn" [class.active]="activeCategory === 'all'" (click)="setActiveCategory('all')">
                {{ langService.t().skills.categories['all'] }}
            </button>
            <button *ngFor="let category of skillCategories" class="filter-btn"
                [class.active]="activeCategory === category.titleKey" (click)="setActiveCategory(category.titleKey)">
                {{ langService.t().skills.categories[category.titleKey] }}
            </button>
        </div>

        <div *ngFor="let category of displayedCategories" class="skills-category-group">
            <h3 class="category-title" *ngIf="activeCategory === 'all'">{{ langService.t().skills.categories[category.titleKey] }}</h3>
            <div class="skills-grid">
                <div *ngFor="let skill of category.items; index as j" class="skill-card" [style.--i]="j">
                    <div class="skill-icon-wrapper">
                        <img [src]="skill.icon" [alt]="skill.name + ' Logo'" width="48" height="48" loading="lazy" decoding="async">
                    </div>
                    <p class="skill-name">{{ skill.name }}</p>
                </div>
            </div>
        </div>
    </div>
</div>
