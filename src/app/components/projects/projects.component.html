<div class="container">
  <h2 class="section-title">{{ langService.t().projects.section_title }}</h2>

  <div class="projects-grid">
    <article *ngFor="let project of projectsList()" class="app-card project-card">

      <div class="project-header">
        <div class="project-logo" *ngIf="project.logo">
          <img [src]="project.logo" [alt]="project.title + ' Logo'">
        </div>
        <div class="project-title-area">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-subtitle">{{ project.subtitle }}</p>
        </div>
      </div>

      <div class="project-body">
        <div *ngFor="let acc of project.achievements" class="project-achievement">
          <strong>{{ acc.label }}:</strong>
          {{ acc.text }}
        </div>
      </div>

      <div class="project-footer">
        <div class="tech-stack">
          <span *ngFor="let tech of project.techStack" class="tech-badge">{{ tech }}</span>
        </div>

        <div class="project-actions">
          <a *ngIf="project.linkUrl" [href]="project.linkUrl" target="_blank" rel="noopener noreferrer"
            class="btn-primary-custom w-100">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-github"
              viewBox="0 0 16 16" style="margin-right: 8px;">
              <path
                d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.012 8.012 0 0 0 16 8c0-4.42-3.58-8-8-8z" />
            </svg>
            {{ langService.t().projects.repo_button }}
          </a>
        </div>
      </div>

    </article>
  </div>
</div>
