<div class="container">
  <h2 class="section-title">{{ langService.t().projects.section_title }}</h2>

  <div class="projects-grid">
    <article *ngFor="let project of projectsList()" class="app-card project-card">

      <div class="project-header">
        <div class="project-logo" *ngIf="project.logo">
          <img [src]="project.logo" [alt]="project.title + ' Logo'" loading="lazy" decoding="async">
        </div>
        <div class="project-title-area">
          <h3 class="project-title">{{ project.title }}</h3>
          <p class="project-subtitle">{{ project.subtitle }}</p>
        </div>
      </div>

      <div class="project-body">
        <div *ngFor="let acc of project.achievements" class="project-achievement">
          <strong>{{ acc.label }}:</strong>
          {{ acc.text }}
        </div>
      </div>

      <div class="project-footer">
        <div class="tech-stack">
          <span *ngFor="let tech of project.techStack" class="tech-badge">{{ tech }}</span>
        </div>

        <div class="project-actions">
          <a *ngIf="project.linkUrl" [href]="project.linkUrl" target="_blank" rel="noopener noreferrer"
            class="btn-primary-custom w-100">
            <span class="btn-icon">
              <app-icon name="github" [size]="16"></app-icon>
            </span>
            {{ langService.t().projects.repo_button }}
          </a>
        </div>
      </div>

    </article>
  </div>
</div>
