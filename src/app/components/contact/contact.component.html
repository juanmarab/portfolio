<div class="container">
  <div class="contact-inner">

    <p class="contact-intro text-muted">{{ langService.t().contact.subtitle }}</p>

    <div class="contact-grid">
      <div class="contact-column" appReveal>
        <h3 class="contact-column-title">{{ langService.t().contact.meeting_title }}</h3>
        <div class="app-card calendly-card">
          <app-calendly-widget [calendlyUrl]="'https://calendly.com/jrabunal/30-meeting'" style="flex-grow: 1;">
          </app-calendly-widget>
        </div>
      </div>

      <div class="contact-column" appReveal [revealDelay]="120">
        <h3 class="contact-column-title">{{ langService.t().contact.message_title }}</h3>

        <form (ngSubmit)="sendEmail(contactForm)" #contactForm="ngForm" class="app-card">

          <div class="form-field">
            <label for="name" class="field-label">
              <app-icon name="user" [size]="14"></app-icon> {{ langService.t().contact.name_label }}
            </label>
            <input type="text" id="name" name="name" class="premium-input"
              [placeholder]="langService.t().contact.name_placeholder" required ngModel #name="ngModel">
          </div>

          <div class="form-field">
            <label for="email" class="field-label">
              <app-icon name="envelope" [size]="14"></app-icon> {{ langService.t().contact.email_label }}
            </label>
            <input type="email" id="email" name="email" class="premium-input"
              [placeholder]="langService.t().contact.email_placeholder" required email ngModel #email="ngModel">
          </div>

          <div class="form-field">
            <label for="message" class="field-label">
              <app-icon name="chat" [size]="14"></app-icon> {{ langService.t().contact.message_label }}
            </label>
            <textarea id="message" name="message" rows="5" class="premium-input"
              [placeholder]="langService.t().contact.message_placeholder" required ngModel
              #message="ngModel"></textarea>
          </div>

          <button type="submit" class="btn-primary-custom contact-submit"
            [disabled]="!contactForm.valid || status() === 'sending'">
            <span *ngIf="status() === 'sending'; else sendIcon" class="contact-spinner" aria-hidden="true"></span>
            <ng-template #sendIcon><app-icon name="send" [size]="16"></app-icon></ng-template>
            {{ status() === 'sending' ? langService.t().contact.sending : langService.t().contact.submit_button }}
          </button>

          <p class="form-status" role="status" aria-live="polite"
            [class.form-status--error]="status() === 'error' || status() === 'invalid'"
            [class.form-status--success]="status() === 'sent'"
            [class.is-visible]="status() !== 'idle'">{{ statusMessage() }}</p>
        </form>

      </div>
    </div>

  </div>
</div>
